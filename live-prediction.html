<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐼 Pogo's Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .prediction-card {
            background: white;
            border-radius: 30px;
            padding: 50px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            animation: fall 3s linear infinite;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
        
        .title {
            color: #667eea;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .mascot {
            font-size: 120px;
            animation: bounce 1s ease-in-out infinite;
            display: inline-block;
            margin: 20px 0;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(-5deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-10px) rotate(5deg); }
        }
        
        .mascot-name {
            font-size: 28px;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 30px;
        }
        
        .teams {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
        }
        
        .vs {
            color: #667eea;
            margin: 0 15px;
        }
        
        .prediction-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .prediction-text {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .score {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .confidence {
            font-size: 24px;
            margin-top: 15px;
        }
        
        .share-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        
        .share-link {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
        }
        
        .copy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
        }
        
        .copy-btn:hover {
            background: #45a049;
        }
        
        .new-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
        }
        
        .new-btn:hover {
            background: #5568d3;
        }
        
        .success-message {
            color: #4CAF50;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
        
        .sparkle {
            display: inline-block;
            animation: sparkle 1.5s ease-in-out infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="prediction-card">
        <div class="title" id="matchTitle">World Cup 2026 - Group Stage</div>
        
        <div class="mascot">🐼</div>
        <div class="mascot-name">Pogo the Predictor</div>
        
        <div class="teams">
            <span id="homeTeam">Brazil</span>
            <span class="vs">VS</span>
            <span id="awayTeam">Argentina</span>
        </div>
        
        <div class="prediction-box">
            <div class="prediction-text" id="predictionText">
                I predict Brazil will win! <span class="sparkle">✨</span>
            </div>
            <div class="score" id="score">2-1</div>
            <div class="confidence" id="confidence">🌟 High Confidence</div>
        </div>
        
        <div class="share-section">
            <h3 style="color: #333; margin-bottom: 15px;">📤 Share in Slack</h3>
            <p style="color: #666; margin-bottom: 15px;">Copy this link and paste it in your Slack channel:</p>
            <div class="share-link" id="shareLink">Loading...</div>
            <button class="copy-btn" onclick="copyLink()">📋 Copy Link</button>
            <button class="new-btn" onclick="createNew()">🎲 Create New Prediction</button>
            <div class="success-message" id="successMsg">✅ Link copied! Paste it in Slack!</div>
        </div>
    </div>
    
    <script>
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const homeTeam = params.get('home') || 'Brazil';
        const awayTeam = params.get('away') || 'Argentina';
        const winner = params.get('winner') || homeTeam;
        const score = params.get('score') || '2-1';
        const confidence = params.get('confidence') || 'high';
        const title = params.get('title') || 'World Cup 2026 - Group Stage';
        
        // Update display
        document.getElementById('matchTitle').textContent = title;
        document.getElementById('homeTeam').textContent = homeTeam;
        document.getElementById('awayTeam').textContent = awayTeam;
        document.getElementById('score').textContent = score;
        
        const predictionText = winner === 'draw' 
            ? 'I predict a DRAW! 🤝' 
            : `I predict ${winner} will win! ✨`;
        document.getElementById('predictionText').innerHTML = predictionText;
        
        const confidenceEmoji = confidence === 'high' ? '🌟' : confidence === 'medium' ? '✨' : '🐾';
        document.getElementById('confidence').textContent = 
            `${confidenceEmoji} ${confidence.charAt(0).toUpperCase() + confidence.slice(1)} Confidence`;
        
        // Generate shareable link
        const shareUrl = window.location.href;
        document.getElementById('shareLink').textContent = shareUrl;
        
        function copyLink() {
            const link = document.getElementById('shareLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                document.getElementById('successMsg').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('successMsg').style.display = 'none';
                }, 3000);
            });
        }
        
        function createNew() {
            window.location.href = 'prediction-link-generator.html';
        }
        
        // Add some confetti
        function createConfetti() {
            const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 3 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 100);
            }
        }
        
        createConfetti();
    </script>
</body>
</html>
